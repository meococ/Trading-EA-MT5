# =====================================================================
# COST MODEL — theo spec v3 §9 (số verify 17/07/2026, cập nhật mỗi quý)
# Đơn vị: XAUUSD = USD per oz (1 lot = 100 oz; $0.01 = $1/lot)
#         EURUSD = pip (1 pip = 0.0001 = $10/lot)
# KHÔNG dùng "pip" cho gold (broker định nghĩa lệch nhau 10 lần)
# =====================================================================
meta:
  last_updated: "2026-07-17"
  account_type: raw_ecn        # raw_ecn | standard
  update_rule: "review mỗi quý hoặc khi đổi broker; swap tính theo cơ chế bên dưới"

XAUUSD:
  contract_size: 100                # oz / lot
  price_unit_value_per_lot: 100.0   # $ per $1.00/oz per lot
  digits: 2
  spread:                           # USD per oz
    p50: 0.12
    p75: 0.20
    p90: 0.35
    news_tail: [0.80, 2.00]
  slippage_adverse:                 # USD per oz
    p50: 0.05
    p90: 0.30
    news: [0.50, 2.00]
  commission_rt_per_lot: 7.0        # $ round-turn
  swap_per_lot_per_night:
    long: -55.0                     # range [-90, -40] — cập nhật theo rates
    short: 20.0                     # dùng 0.0 nếu chạy conservative
    short_conservative: 0.0
  swap_mechanism: "long ~ -(SOFR + 1..3%) * price * 100 / 360"
  triple_day: WED                   # đọc từ broker spec, KHÔNG hard-code trong code
  weekend_rollovers_fri_to_mon: 1   # số rollover bị charge Fri→Mon (verify với broker)

EURUSD:
  contract_size: 100000
  pip: 0.0001
  pip_value_per_lot: 10.0           # $ per pip per lot
  digits: 5
  spread:                           # pips
    p50: 0.1
    p75: 0.2
    p90: 0.4
    news_tail: [1.0, 3.0]
  slippage_adverse:                 # pips
    p50: 0.05
    p90: 0.2
    news: [1.0, 3.0]
  commission_rt_per_lot: 7.0
  swap_per_lot_per_night:
    long: -8.0
    short: 2.5
    short_conservative: 0.0
  triple_day: WED
  weekend_rollovers_fri_to_mon: 1

# Kịch bản backtest bắt buộc: chạy cả 3 (p50/p75/p90).
# Gates §10 tính trên p75; p90 expectancy phải > 0.
backtest_scenarios: [p50, p75, p90]

# Standard account (sensitivity, không phải baseline)
standard_account_sensitivity:
  XAUUSD_spread_range: [0.25, 0.35]   # USD/oz
  EURUSD_spread_range: [0.9, 1.1]     # pips
  commission_rt_per_lot: 0.0
